name: Daily Colin Furze to Spotify

on:
  push:
    branches: [main]
    paths:
      - 'sync.py'
      - '.github/workflows/daily.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
      timezone: Europe/Amsterdam

permissions:
  contents: write

concurrency:
  group: colinfurze-spotify-sync
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import Python module and verify known extraction/matching smoke cases
        run: |
          python -m py_compile sync.py
          python - <<'PY'
          import sync
          assert callable(sync.extract_description)
          assert callable(sync.rank)
          assert sync.assess("Sample Band","Sample Song",{
              "name":"Sample Song","artists":[{"name":"Sample Band"}]
          }).status == "likely_match"
          assert sync.assess("Sample Band","Sample Song",{
              "name":"Sample Song (Demo)","artists":[{"name":"Sample Band"}]
          }).status != "likely_match"
          print("Import, extractor and conservative Spotify match policy: OK")
          PY

  synchronize:
    if: "github.event_name != 'push' || github.event.head_commit.message == 'test: verify cloud credentials and Spotify sync'"
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify script syntax
        run: python -m py_compile sync.py
      - name: Probe four API secrets without printing their values
        if: github.event_name == 'push'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, sync
          missing = [key for key in sync.REQUIRED if not os.getenv(key)]
          if missing: raise RuntimeError('Missing GitHub secrets: ' + ', '.join(missing))
          response = sync.yt('channels', part='id', id=sync.YOUTUBE_CHANNELS['colinfurze'])
          assert response.get('items'), 'YouTube returned no channel'
          print('YouTube API: OK')
          catalog = sync.spotify_token('client_credentials')
          assert catalog, 'Spotify client credentials failed'
          print('Spotify client credentials: OK')
          token = sync.spotify_token('refresh_token', user=True)
          profile = sync.spotify_api('/me', token)
          playlist = sync.spotify_api('/playlists/' + sync.SPOTIFY_PLAYLIST, token)
          assert playlist['owner']['id'] == profile['id'], 'Playlist not owned by user'
          print('Spotify user refresh token, playlist owner: OK')
          print('Playlist items:', len(sync.playlist_items(token)))
          PY
      - name: Check YouTube and update Spotify
        id: spotify
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python sync.py
      - name: Preserve public run history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json data/runs.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "chore: archive daily Spotify sync $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Fail the run if Spotify sync failed
        if: steps.spotify.outcome == 'failure'
        run: exit 1
